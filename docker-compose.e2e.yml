services:
  postgres:
    image: postgres:16-alpine
    container_name: ymm-remotion-e2e-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: yukkuri_movie_maker
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d yukkuri_movie_maker"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - ymm-remotion-e2e-postgres:/var/lib/postgresql/data

volumes:
  ymm-remotion-e2e-postgres:
